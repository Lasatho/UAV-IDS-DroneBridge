/*
 * wmediumd medium model for the DroneBridge SITL testbed.
 *
 * Without wmediumd, mac80211_hwsim delivers every frame to every radio with
 * no interference model, so an RF jamming flood has no effect. wmediumd
 * serialises the shared medium and applies an SNR/interference model, so a
 * high-rate flood on the attacker radio (wlan2) contends with and degrades
 * the DroneBridge link.
 *
 * The three radios map to the hwsim interfaces (load order is deterministic):
 *   id 0 = 02:00:00:00:00:00  wlan0  (DroneBridge UAV proxy)
 *   id 1 = 02:00:00:00:01:00  wlan1  (DroneBridge GCS proxy)
 *   id 2 = 02:00:00:00:02:00  wlan2  (attacker / rf_jamming, frame_injection)
 *
 * SNR is set high (60 dB) on every link so that, with no attack traffic, the
 * benign DroneBridge link stays clean (no added packet loss or jitter that
 * would diverge from the wmediumd-less benign training set). Loss only arises
 * from medium contention when the attacker floods the channel.
 */
ifaces :
{
    ids = [
        "02:00:00:00:00:00",
        "02:00:00:00:01:00",
        "02:00:00:00:02:00"
    ];
};

model :
{
    type = "snr";

    /* No random baseline loss: benign link must be reliable. */
    default_prob = 0.0;

    /* Pairwise SNR in dB. All radios in close range => reliable when idle. */
    links = (
        (0, 1, 60),
        (0, 2, 60),
        (1, 2, 60)
    );
};
