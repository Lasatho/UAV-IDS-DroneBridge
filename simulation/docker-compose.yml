services:

  gazebo:
    build: ./gazebo
    container_name: uav_ids_gazebo
    privileged: true
    network_mode: host
    environment:
      - GZ_SIM_SYSTEM_PLUGIN_PATH=/usr/local/lib/ardupilot_gazebo
      - GZ_SIM_RESOURCE_PATH=/opt/ardupilot_gazebo/models:/opt/ardupilot_gazebo/worlds
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # world with WindEffects settings; mounted so it can change without
      # rebuilding (and re-distributing) the gazebo image
      - ./gazebo/worlds/iris_runway_wind.sdf:/opt/ardupilot_gazebo/worlds/iris_runway_wind.sdf:ro
    restart: unless-stopped

  ardupilot:
    build: ./ardupilot
    container_name: uav_ids_ardupilot
    privileged: true
    network_mode: host
    depends_on:
      - gazebo
    restart: unless-stopped

  dronebridge_gcs:
    build:
      context: ..
      dockerfile: simulation/dronebridge.Dockerfile
    container_name: uav_ids_db_gcs
    privileged: true
    network_mode: host
    # db_proxy crashes (SIGSEGV) on the random frames of rf_jamming. The
    # crash is part of the attack effect, but restarting the whole container
    # ~20 times in a row kept dockerd busy on ~7 cores for ~3 min and slowed
    # the lockstep simulation to RTF ~0.8 (attack dataset Befund 31). The
    # process is therefore restarted inside the container, after 1 s like
    # the observed container restarts; Docker only restarts the container if
    # the loop itself dies.
    command:
      - sh
      - -c
      - |
        trap 'kill $$child 2>/dev/null; exit 0' TERM INT
        while :; do
          /opt/dronebridge/db_proxy -n wlan1 -m m -c 200 -p 5750 -d 1 &
          child=$$!
          wait $$child
          echo "[supervisor] db_proxy exited with $$?, restarting in 1 s"
          sleep 1
        done
    depends_on:
      - ardupilot
    restart: unless-stopped

  dronebridge_uav:
    build:
      context: ..
      dockerfile: simulation/dronebridge.Dockerfile
    container_name: uav_ids_db_uav
    privileged: true
    network_mode: host
    # db_proxy crashes (SIGSEGV) on the random frames of rf_jamming. The
    # crash is part of the attack effect, but restarting the whole container
    # ~20 times in a row kept dockerd busy on ~7 cores for ~3 min and slowed
    # the lockstep simulation to RTF ~0.8 (attack dataset Befund 31). The
    # process is therefore restarted inside the container, after 1 s like
    # the observed container restarts; Docker only restarts the container if
    # the loop itself dies.
    command:
      - sh
      - -c
      - |
        trap 'kill $$child 2>/dev/null; exit 0' TERM INT
        while :; do
          /opt/dronebridge/db_proxy -n wlan0 -m m -c 200 -p 5751 -d 3 &
          child=$$!
          wait $$child
          echo "[supervisor] db_proxy exited with $$?, restarting in 1 s"
          sleep 1
        done
    depends_on:
      - ardupilot
    restart: unless-stopped

  socat:
    image: alpine/socat
    container_name: uav_ids_socat
    network_mode: host
    command: -d TCP:127.0.0.1:5751,retry=30,interval=2 TCP:127.0.0.1:5760,retry=30,interval=2
    depends_on:
      - ardupilot
      - dronebridge_uav
    restart: unless-stopped

  mavproxy:
    build: ./mavproxy
    container_name: uav_ids_mavproxy
    network_mode: host
    command: >
      mavproxy.py
      --master=tcp:127.0.0.1:5750
      --out=udp:127.0.0.1:14552
      --out=udp:127.0.0.1:14553
      --out=udp:127.0.0.1:14554
      --non-interactive
    depends_on:
      - dronebridge_gcs
    restart: unless-stopped

  orchestrator:
    build:
      context: ..
      dockerfile: simulation/orchestrator/Dockerfile
    environment:
      - NTFY_TOPIC=uav-ids-lasse
    container_name: uav_ids_orchestrator
    # privileged for raw-socket RF attacks (Scapy sendp on the wlan2 monitor
    # interface); matches the rest of the stack and the verified attack tests.
    privileged: true
    network_mode: host
    # Manifest is selectable so the same stack runs the normal or the attack
    # dataset: MANIFEST=missions_manifest_attacks.csv ./start_sim.sh
    command: >
      python3 orchestrator.py
      --manifest /data/${MANIFEST:-missions_manifest.csv}
      --output /data
    volumes:
      - ${REPO_ROOT}/dataset:/data
    depends_on:
      - mavproxy
    restart: unless-stopped
